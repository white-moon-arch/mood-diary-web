<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>情绪日记 - 历史记录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeBtn" title="切换日间/夜间模式">🌙</button>


    <div class="container">
        <h1>历史情绪日记</h1>

        <!-- 搜索 + 导入导出 -->
        <div class="search-bar">
            <input type="text" id="searchKeyword" placeholder="输入关键词搜索日记...">
            <button id="searchBtn">搜索</button>
            <button id="exportBtn">导出全部日记(JSON)</button>
            <button id="importBtn">导入备份JSON</button>
            <input type="file" id="importFile" accept=".json" style="display:none;">

        </div>

        <div class="nav-row">
            <a href="index.html"><button>新建日记</button></a>
        </div>

        <!-- 日记列表容器 -->
        <div id="diaryList"></div>

        <div class="nav-row">
            <a href="stats.html"><button>情绪统计图表</button></a>
        </div>

        <!-- 分页区域 -->
        <div id="pageBox">
            <button id="prevBtn">上一页</button>
            <span id="pageInfo">第1页</span>
            <button id="nextBtn">下一页</button>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="mask" id="editMask">
        <div class="edit-card">
            <h3>编辑日记</h3>
            <div class="item">
                <label>标题</label>
                <input type="text" id="editTitle">
            </div>
            <div class="item">
                <label>情绪</label>
                <input type="text" id="editMood">
            </div>
            <div class="item">
                <label>内容</label>
                <textarea id="editContent" rows="5"></textarea>
            </div>
            <input type="hidden" id="editId">
            <div class="nav-row" style="text-align:right;">
                <button id="cancelEdit">取消</button>
                <button id="saveEdit">保存修改</button>
            </div>
        </div>
    </div>

        <!-- 悬浮白噪音播放器 -->
    <div class="music-player">
        <button class="music-toggle" id="musicToggle" title="自然白噪音">🎵</button>
        <div class="music-list" id="musicList">
            <div class="music-item" data-src="audio/白浪逐沙.mp3">🌊 白浪逐沙</div>
            <div class="music-item" data-src="audio/潺潺流溪.mp3">💧 潺潺流溪</div>
            <div class="music-item" data-src="audio/林间鸟语.mp3">🐦 林间鸟语</div>
            <div class="music-item" data-src="audio/暖意篝火.mp3">🔥 暖意篝火</div>
            <div class="music-item" data-src="audio/夏夜虫鸣.mp3">🦗 夏夜虫鸣</div>
            <div class="music-item" data-src="audio/闲时听雨.mp3">🌧️ 闲时听雨</div>
            <div class="music-item" data-src="audio/云隙来风.mp3">🍃 云隙来风</div>
        </div>
        
    </div>
    <audio id="bgAudio" loop>


<script src="api.js"></script>
<script src="list.js"></script>
</body>
</html>
