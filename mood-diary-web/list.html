<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>情绪日记 - 历史记录</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /*编辑弹窗样式*/
        .mask{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);
            display:none;align-items:center;justify-content:center;
        }
        .edit-card{
            background:#fff;padding:24px;border-radius:16px;width:450px;
        }
        .mask.show{display:flex;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 历史情绪日记</h1>
        <div style="text-align:center;margin-bottom:20px;">
            <a href="index.html"><button style="width:auto;padding:8px 16px;">新建日记</button></a>
        </div>
        <div id="diaryList"></div>

        <a href="stats.html"><button>📊 情绪统计图表</button></a>


        <div id="pageBox" style="text-align:center;margin-top:24px;">
            <button id="prevBtn" style="width:auto;display:inline-block;margin:0 5px;">上一页</button>
            <span id="pageInfo">第1页</span>
            <button id="nextBtn" style="width:auto;display:inline-block;margin:0 5px;">下一页</button>
        </div>
    </div>

    <!--编辑弹窗-->
    <div class="mask" id="editMask">
        <div class="edit-card">
            <h3>编辑日记</h3>
            <div class="item">
                <label>标题</label>
                <input type="text" id="editTitle">
            </div>
            <div class="item">
                <label>情绪</label>
                <input type="text" id="editMood">
            </div>
            <div class="item">
                <label>内容</label>
                <textarea id="editContent" rows="5"></textarea>
            </div>
            <input type="hidden" id="editId">
            <div style="margin-top:16px;text-align:right;">
                <button id="cancelEdit">取消</button>
                <button id="saveEdit">保存修改</button>
            </div>
        </div>
    </div>

<script src="api.js"></script>
<script src="list.js"></script>
</body>
</html>
