<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增情绪日记</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 沉浸式页面容器 */
        .immerse-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 对话气泡样式 */
        .chat-bubble {
            background: #fff;
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(123, 104, 199, 0.15);
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 淡出动画 */
        .fade-out {
            animation: fadeOut 0.4s ease forwards;
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* 情绪选择卡片 */
        .mood-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.2s forwards;
        }
        .mood-card {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .mood-card:hover {
            border-color: #7b68ee;
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(123, 104, 199, 0.2);
        }
        .mood-card .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }

        /* 输入区域 */
        .input-area {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        .input-area label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-area input,
        .input-area textarea {
            width: 100%;
            border: 2px solid #e8e4f5;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            background: #fcfbff;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .input-area input:focus,
        .input-area textarea:focus {
            outline: none;
            border-color: #7b68ee;
        }

        /* 下一步/保存按钮 */
        .action-btn {
            width: 100%;
            padding: 16px;
            background: #7b68ee;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.4s forwards;
        }
        .action-btn:hover {
            background: #6755d4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 104, 199, 0.3);
        }

        /* 底部导航 */
        .nav-links {
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.6s forwards;
        }
        .nav-links a button {
            margin: 0 8px;
            padding: 10px 20px;
        }

        /* 成功结束页 */
        .end-screen {
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }
        .end-screen h2 {
            color: #7b68ee;
            margin-bottom: 16px;
        }
        .end-screen p {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="immerse-container">
        <!-- 阶段1：开场问候 -->
        <div id="step1">
            <div class="chat-bubble">
                今天阳光明媚，感觉你会有个不错的心情呢，快写下今天的日记，记录下你的好心情吧 ✨
            </div>
            <button class="action-btn" onclick="goStep2()">开始记录</button>
        </div>

        <!-- 阶段2：选择情绪 -->
        <div id="step2" style="display:none;">
            <div class="chat-bubble" id="moodTip">
                先来选一下，今天是什么心情呀？
            </div>
            <div class="mood-cards">
                <div class="mood-card" onclick="selectMood('😊 开心')">
                    <span class="emoji">😊</span>开心
                </div>
                <div class="mood-card" onclick="selectMood('😌 平静')">
                    <span class="emoji">😌</span>平静
                </div>
                <div class="mood-card" onclick="selectMood('😔 低落')">
                    <span class="emoji">😔</span>低落
                </div>
                <div class="mood-card" onclick="selectMood('😠 烦躁')">
                    <span class="emoji">😠</span>烦躁
                </div>
                <div class="mood-card" onclick="selectMood('🤩 兴奋')">
                    <span class="emoji">🤩</span>兴奋
                </div>
            </div>
            <div style="margin-top:20px;">
                <button class="action-btn" id="nextBtn" style="display:none;" onclick="goStep3()">下一步，写日记</button>
            </div>
        </div>

        <!-- 阶段3：填写日记内容 -->
        <div id="step3" style="display:none;">
            <div class="chat-bubble" id="contentTip">
                好啦，把今天想说的话都写下来吧~
            </div>
            <div class="input-area">
                <label>日记标题</label>
                <input type="text" id="titleInput" placeholder="给今天起个小标题...">
                <label>日记内容</label>
                <textarea id="contentInput" rows="6" placeholder="写下此刻的心情..."></textarea>
            </div>
            <button class="action-btn" onclick="saveDiary()">保存日记</button>
        </div>

        <!-- 阶段4：保存成功结束语 -->
        <div id="step4" style="display:none;">
            <div class="end-screen">
                <h2>💫 记录完成</h2>
                <p>
                    今天的心情已经好好保存起来啦<br>
                    每一天的情绪都值得被看见<br>
                    明天也要继续加油哦~
                </p>
                <a href="list.html"><button class="action-btn" style="max-width:300px;margin:0 auto;">查看我的日记</button></a>
            </div>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="list.html"><button style="width:auto;padding:8px 16px;">查看历史日记</button></a>
            <a href="stats.html"><button style="width:auto;padding:8px 16px;">📊 情绪统计图表</button></a>
        </div>
    </div>

<script src="api.js"></script>
<script src="main.js"></script>
<script>
    let selectedMood = '';

    // 不同情绪对应的回应文案
    const moodReply = {
        '😊 开心': '太棒啦！开心的日子最值得记录下来，快写下今天发生了什么好事~',
        '😌 平静': '平静的日子也很珍贵呀，安安静静的时光也值得被记录。',
        '😔 低落': '没关系的，低落也是情绪的一部分，写下来就会轻松一点哦。',
        '😠 烦躁': '烦躁的时候更要写下来呀，把坏情绪都留在日记里。',
        '🤩 兴奋': '哇，听起来超棒的！快把这份激动的心情记录下来吧~'
    };

    function goStep2() {
        const step1 = document.getElementById('step1');
        step1.classList.add('fade-out');
        setTimeout(() => {
            step1.style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }, 400);
    }

    function selectMood(mood) {
        selectedMood = mood;
        // 更新气泡文案
        document.getElementById('moodTip').textContent = moodReply[mood];
        // 高亮选中的情绪卡片
        document.querySelectorAll('.mood-card').forEach(card => {
            card.style.borderColor = '#eee';
            card.style.background = '#fff';
        });
        event.currentTarget.style.borderColor = '#7b68ee';
        event.currentTarget.style.background = '#f3f0ff';
        // 显示下一步按钮
        document.getElementById('nextBtn').style.display = 'block';
    }

    function goStep3() {
        const step2 = document.getElementById('step2');
        step2.classList.add('fade-out');
        setTimeout(() => {
            step2.style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        }, 400);
    }

    function saveDiary() {
        const title = document.getElementById('titleInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();
        if (!title || !content) {
            alert('标题和内容都要写一点哦~');
            return;
        }
        // 调用保存接口
        saveDiaryApi({ title, mood: selectedMood, content }).then(res => {
            if (res.code === 0) {
                // 过渡到结束页
                const step3 = document.getElementById('step3');
                step3.classList.add('fade-out');
                document.getElementById('navLinks').style.display = 'none';
                setTimeout(() => {
                    step3.style.display = 'none';
                    document.getElementById('step4').style.display = 'block';
                }, 400);
            }
        });
    }
</script>
</body>
</html>
