<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增情绪日记</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 仅保留分步动画，外观样式统一由外部style.css控制 */
        .fade-out {
            animation: fadeOut 0.4s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }
        .step-box {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        .immerse-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeBtn" title="切换日间/夜间模式">🌙</button>

    <div class="immerse-container">
        <!-- 阶段1：开场问候 -->
        <div id="step1" class="step-box">
            <div class="chat-bubble">
                今天阳光明媚，感觉你会有个不错的心情呢，快写下今天的日记，记录下你的好心情吧 ✨
            </div>
            <button class="action-btn" onclick="goStep2()">开始记录</button>
        </div>

        <!-- 阶段2：选择情绪 -->
        <div id="step2" style="display:none;" class="step-box">
            <div class="chat-bubble" id="moodTip">
                先来选一下，今天是什么心情呀？
            </div>
            <div class="mood-cards">
                <div class="mood-card" onclick="selectMood('😊 开心')">
                    <span class="emoji">😊</span>开心
                </div>
                <div class="mood-card" onclick="selectMood('😌 平静')">
                    <span class="emoji">😌</span>平静
                </div>
                <div class="mood-card" onclick="selectMood('😔 低落')">
                    <span class="emoji">😔</span>低落
                </div>
                <div class="mood-card" onclick="selectMood('😠 烦躁')">
                    <span class="emoji">😠</span>烦躁
                </div>
                <div class="mood-card" onclick="selectMood('🤩 兴奋')">
                    <span class="emoji">🤩</span>兴奋
                </div>
            </div>

            <!-- 新增：补充情绪输入（选填，选完主情绪后显示） -->
            <div class="supplement-mood" id="supplementMoodBox" style="display:none; margin-top:20px;">
                <label style="color:#94a3b8; font-size:14px; margin-bottom:8px; display:block;">
                    可以再补充一句更具体的心情（选填）
                </label>
                <input type="text" id="supplementMood" placeholder="比如：有点小郁闷、躺平很舒服...">
            </div>

            <div style="margin-top:24px; display:flex; gap:16px;">
                <button class="action-btn" onclick="goBack()" style="flex:1;">返回上一步</button>
                <button class="action-btn" id="nextBtn" style="display:none; flex:1;" onclick="goStep3()">下一步，写日记</button>
            </div>

        </div>

        <!-- 阶段3：填写日记内容 -->
        <div id="step3" style="display:none;" class="step-box">
            <div class="chat-bubble" id="contentTip">
                好啦，把今天想说的话都写下来吧~
            </div>
            <div class="input-area">
                <div class="item">
                    <label>日记标题</label>
                    <input type="text" id="titleInput" placeholder="给今天起个小标题...">
                </div>
                <!-- 天气选择 -->
                <div class="weather-select">
                    <label>今天的天气是？</label>
                    <div class="weather-options">
                        <button type="button" class="weather-btn" data-weather="晴">☀️ 晴</button>
                        <button type="button" class="weather-btn" data-weather="多云">⛅ 多云</button>
                        <button type="button" class="weather-btn" data-weather="阴">☁️ 阴</button>
                        <button type="button" class="weather-btn" data-weather="小雨">🌧️ 小雨</button>
                        <button type="button" class="weather-btn" data-weather="雪">❄️ 雪</button>
                    </div>
                </div>

                <div class="item">
                    <label>日记内容</label>
                    <textarea id="contentInput" rows="6" placeholder="写下此刻的心情..."></textarea>
                </div>
            </div>
            <div style="display:flex; gap:16px;">
                <button class="action-btn" onclick="goBack()" style="flex:1;">返回上一步</button>
                <button class="action-btn" onclick="saveDiary()" style="flex:1;">保存日记</button>
            </div>

        </div>

        <!-- 阶段4：保存成功结束语 -->
        <div id="step4" style="display:none;" class="step-box">
            <div class="end-screen">
                <h2>💫 记录完成</h2>
                <p>
                    今天的心情已经好好保存起来啦<br>
                    每一天的情绪都值得被看见<br>
                    明天也要继续加油哦~
                </p>
                <a href="list.html"><button class="action-btn">查看我的日记</button></a>
            </div>
        </div>

        <div class="nav-row" id="navLinks">
            <a href="list.html"><button>查看历史日记</button></a>
            <a href="stats.html"><button>情绪统计图表</button></a>
        </div>
    </div>

        <!-- 悬浮白噪音播放器 -->
    <div class="music-player">
        <button class="music-toggle" id="musicToggle" title="自然白噪音">🎵</button>
        <div class="music-list" id="musicList">
            <div class="music-item" data-src="audio/白浪逐沙.mp3">🌊 白浪逐沙</div>
            <div class="music-item" data-src="audio/潺潺流溪.mp3">💧 潺潺流溪</div>
            <div class="music-item" data-src="audio/林间鸟语.mp3">🐦 林间鸟语</div>
            <div class="music-item" data-src="audio/暖意篝火.mp3">🔥 暖意篝火</div>
            <div class="music-item" data-src="audio/夏夜虫鸣.mp3">🦗 夏夜虫鸣</div>
            <div class="music-item" data-src="audio/闲时听雨.mp3">🌧️ 闲时听雨</div>
            <div class="music-item" data-src="audio/云隙来风.mp3">🍃 云隙来风</div>
        </div>
        
    </div>
    <audio id="bgAudio" loop></audio>

        <!-- 左侧情绪小知识卡片 -->
    <div class="mood-tip-card">
        <div class="tip-header">
            <span>💡 情绪小知识</span>
            <button class="tip-refresh" id="tipRefresh" title="换一条">🔄</button>
        </div>
        <div class="tip-content" id="tipContent">
            接纳所有情绪，没有所谓的“坏情绪”，每一种感受都有它的意义。
        </div>
    </div>


<script src="api.js"></script>
<script>
    let selectedMood = '';
    let supplementMood = ''; // 新增：补充情绪

    // 不同情绪对应的回应文案
    const moodReply = {
        '😊 开心': '太棒啦！开心的日子最值得记录下来，快写下今天发生了什么好事~',
        '😌 平静': '平静的日子也很珍贵呀，安安静静的时光也值得被记录。',
        '😔 低落': '没关系的，低落也是情绪的一部分，写下来就会轻松一点哦。',
        '😠 烦躁': '烦躁的时候更要写下来呀，把坏情绪都留在日记里。',
        '🤩 兴奋': '哇，听起来超棒的！快把这份激动的心情记录下来吧~'
    };

    function goStep2() {
        const step1 = document.getElementById('step1');
        step1.classList.add('fade-out');
        setTimeout(() => {
            step1.style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }, 400);
    }

    function selectMood(mood) {
        selectedMood = mood;
        document.getElementById('moodTip').textContent = moodReply[mood];
        
        // 移除所有卡片的选中态
        document.querySelectorAll('.mood-card').forEach(card => {
            card.classList.remove('active');
        });
        // 给当前点击的卡片加选中态
        event.currentTarget.classList.add('active');
        
        // 显示补充输入框和下一步按钮
        document.getElementById('supplementMoodBox').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'block';
    }


    function goStep3() {
        const step2 = document.getElementById('step2');
        step2.classList.add('fade-out');
        setTimeout(() => {
            step2.style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        }, 400);
    }

   function saveDiary() {
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    // 读取补充情绪
    supplementMood = document.getElementById('supplementMood').value.trim();

    if (!title || !content) {
        alert('标题和内容都要写一点哦~');
        return;
    }

    saveDiaryApi({
        title,
        mood: selectedMood,
        supplementMood: supplementMood, // 新增字段
        content
    }).then(res => {
        if (res.code === 0) {
            // 原有保存成功逻辑
        } else {
            alert(res.msg);
        }
    });
}


// 返回上一步
function goBack() {
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step1 = document.getElementById('step1');

    // 当前在第2步 → 返回第1步
    if (step2.style.display === 'block') {
        step2.classList.add('fade-out');
        setTimeout(() => {
            step2.style.display = 'none';
            step1.style.display = 'block';
        }, 400)
    }

    // 当前在第3步 → 返回第2步
    else if (step3.style.display === 'block') {
        step3.classList.add('fade-out');
        setTimeout(() => {
            step3.style.display = 'none';
            step2.style.display = 'block';
        }, 400);
    }
}

</script>
</body>
</html>
