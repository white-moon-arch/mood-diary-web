<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日记详情 - 情绪日记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeBtn" title="切换日间/夜间模式">🌙</button>

    <!-- 左侧情绪小知识卡片 -->
    <div class="mood-tip-card">
        <div class="tip-header">
            <span>💡 情绪小知识</span>
            <button class="tip-refresh" id="tipRefresh" title="换一条">🔄</button>
        </div>
        <div class="tip-content" id="tipContent">
            接纳所有情绪，没有所谓的“坏情绪”，每一种感受都有它的意义。
        </div>
    </div>

    <!-- 详情主内容 -->
    <div class="container detail-container">
        <div class="detail-card">
            <!-- 顶部返回栏 -->
            <div class="detail-header">
                <button class="back-btn" onclick="history.back()">← 返回</button>
                <div class="detail-actions">
                    <button class="btn-secondary" id="editBtn">编辑</button>
                    <button class="btn-danger" id="deleteBtn">删除</button>
                </div>
            </div>

            <!-- 日记标题 -->
            <h1 class="detail-title" id="detailTitle"></h1>

            <!-- 元信息：日期、情绪、天气 -->
            <div class="detail-meta">
                <span class="meta-date" id="detailDate"></span>
                <span class="meta-mood" id="detailMood"></span>
                <span class="meta-weather" id="detailWeather"></span>
            </div>

            <!-- 补充情绪 -->
            <div class="detail-supplement" id="detailSupplement" style="display:none;">
                <span class="supplement-label">补充心情：</span>
                <span id="supplementText"></span>
            </div>

            <!-- 日记正文 -->
            <div class="detail-content" id="detailContent"></div>
        </div>
    </div>

    <!-- 悬浮白噪音播放器 -->
    <div class="music-player">
        <button class="music-toggle" id="musicToggle" title="自然白噪音">🎵</button>
        <div class="music-list" id="musicList">
            <div class="music-item" data-src="audio/白浪逐沙.mp3">🌊 白浪逐沙</div>
            <div class="music-item" data-src="audio/潺潺流溪.mp3">💧 潺潺流溪</div>
            <div class="music-item" data-src="audio/林间鸟语.mp3">🐦 林间鸟语</div>
            <div class="music-item" data-src="audio/暖意篝火.mp3">🔥 暖意篝火</div>
            <div class="music-item" data-src="audio/夏夜虫鸣.mp3">🦗 夏夜虫鸣</div>
            <div class="music-item" data-src="audio/闲时听雨.mp3">🌧️ 闲时听雨</div>
            <div class="music-item" data-src="audio/云隙来风.mp3">🍃 云隙来风</div>
        </div>
    </div>
    <audio id="bgAudio" loop>

    <script src="api.js"></script>
    <script>
        // 获取URL参数
        function getQueryParam(name) {
            const reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURIComponent(r[2]) : null;
        }

        const diaryId = getQueryParam('id');

        // 页面加载时渲染详情
        window.addEventListener('load', () => {
            if (!diaryId) {
                document.querySelector('.detail-card').innerHTML = '<p style="text-align:center;padding:40px;color:#94a3b8;">日记不存在或已被删除</p>';
                return;
            }

            // 读取本地日记数据，强制校验为数组，避免报错
        let diaryList = [];
        try {
            // 这里的 key 要和你项目里保存日记的 key 完全一致
            const rawData = localStorage.getItem('moodDiaryList');
            diaryList = rawData ? JSON.parse(rawData) : [];
            
            // 强制校验：不是数组就重置为空
            if (!Array.isArray(diaryList)) {
                diaryList = [];
            }
            console.log('读取到的日记列表：', diaryList);
        } catch (err) {
            console.error('日记数据解析失败：', err);
            diaryList = [];
        }

        const diary = diaryList.find(item => item.id == diaryId);

            
            if (!diary) {
                document.querySelector('.detail-card').innerHTML = '<p style="text-align:center;padding:40px;color:#94a3b8;">日记不存在或已被删除</p>';
                return;
            }

            // 渲染数据
            document.getElementById('detailTitle').textContent = diary.title;
            document.getElementById('detailDate').textContent = '📅 ' + diary.date;
            document.getElementById('detailMood').textContent = diary.mood;
            document.getElementById('detailWeather').textContent = diary.weather ? '🌤️ ' + diary.weather : '';
            
            // 补充情绪
            if (diary.supplementMood) {
                document.getElementById('detailSupplement').style.display = 'block';
                document.getElementById('supplementText').textContent = diary.supplementMood;
            }

            // 正文（换行处理）
            document.getElementById('detailContent').innerHTML = diary.content.replace(/\n/g, '<br>');

            // 编辑按钮
            document.getElementById('editBtn').addEventListener('click', () => {
                window.location.href = 'index.html?id=' + diary.id;
            });

            // 删除按钮
            document.getElementById('deleteBtn').addEventListener('click', () => {
                if (confirm('确定要删除这篇日记吗？删除后无法恢复。')) {
                    deleteDiaryApi(diary.id);
                    alert('删除成功');
                    window.location.href = 'list.html';
                }
            });
        });
    </script>
</body>
</html>
